name: merge packageId overlay
on:
  push:
    paths:
      - backup/packageids_overlay.json
      - .github/scripts/merge_overlay.py
      - .github/workflows/merge-packageids.yml
  workflow_dispatch:
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge overlay into catalog
        run: python3 .github/scripts/merge_overlay.py
      - name: Commit catalog updates
        run: |
          git config user.name "Cruesoe"
          git config user.email "49525542+Cruesoe@users.noreply.github.com"
          git add index.html backup/progression_packageids.csv README.md
          if git diff --cached --quiet; then
            echo "no catalog changes"
          else
            HAVE=$(python3 -c "import json,re,pathlib; t=pathlib.Path('index.html').read_text(); m=re.search(r'\\((\\d+) of (\\d+)\\)', t); print(m.group(0) if m else '')")
            git commit -m "packageId checkpoint: ${HAVE}"
            git push
          fi
