name: Apply snapshot patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply catalog patch
        run: python3 scripts/apply_snapshot_patch.py
      - name: Commit and push
        run: |
          git config user.name "Cruesoe"
          git config user.email "49525542+Cruesoe@users.noreply.github.com"
          git add index.html backup/progression_packageids.csv backup/progression_collections_categorized.txt
          if git diff --cached --quiet; then
            echo "No file changes"
            exit 0
          fi
          git commit -m "Weekly catalog update 8 Sep 2026: +2 / -0"
          git push origin HEAD:main
