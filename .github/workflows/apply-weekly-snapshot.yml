name: apply weekly snapshot
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
concurrency:
  group: weekly-catalog-snapshot
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install openpyxl
        run: pip install --quiet openpyxl
      - name: Refresh catalog from Steam
        run: python3 .github/scripts/apply_weekly_snapshot.py
      - name: Commit catalog updates
        run: |
          git config user.name "Cruesoe"
          git config user.email "49525542+Cruesoe@users.noreply.github.com"
          git add index.html README.md backup/progression_packageids.csv backup/progression_collections_categorized.txt backup/progression_modpack_mods.txt backup/progression_collections_categorized.xlsx
          if git diff --cached --quiet; then
            echo "no catalog changes"
          else
            git commit -m "Weekly catalog snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
